[project]
name = "support-triage-agent"
version = "0.1.0"
description = "Local support triage agent with MCP tools, built as a case study on Bloomwell's public FAQ"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastmcp>=2.10",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "numpy",
    "ollama>=0.4",
    "python-dotenv>=1.2.4",
]


[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
